services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lichu}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lichu_local}
      POSTGRES_DB: ${POSTGRES_DB:-lichu}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-55434}:5432"
    volumes:
      - lichu_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 15
volumes:
  lichu_data:
