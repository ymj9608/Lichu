      description: '아이디·비밀번호로 인증하고 JWT Access Token을 발급한다. 로그인 정보 저장은 비밀번호 대신 아이디만 브라우저에 보관한다. ID/비밀번호 찾기 버튼에서 사내 계정 문의 절차를
        안내한다. USER는 라이선스 탐색, MASTER는 관리자 대시보드로 이동한다. 인증 실패는 401과 오류 메시지를 표시한다.


        요구사항: REQ-FUNC-002

