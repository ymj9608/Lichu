openapi: 3.1.0
info:
  title: LiChU. 사내 SaaS 라이선스 관리 API
  description: 사용 신청 → 관리자 승인·반려 → 할당 → 반납·회수. 실제 구현의 OpenAPI를 기준으로 작성. 제출 지침에 따라 Security Schemes는 제외하며, 실제 보호 API는 Bearer
    JWT와 역할·소유권 검증을 사용한다. 날짜는 YYYY-MM-DD, 시각은 ISO-8601 UTC. 필드 오류는 422, 잘못된 업무 상태는 400, 동시 충돌·좌석 부족은 409이다.
  version: 1.2.0
paths:
  /api/departments:
    get:
      tags:
      - Auth
      summary: 회원가입 부서 목록
      operationId: departments_api_departments_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/DepartmentOut'
                type: array
                title: Response Departments Api Departments Get
              example:
              - id: 2
                name: 개발팀
        '500':
          description: 'INTERNAL_ERROR: 서버 오류가 발생했습니다. 잠시 후 다시 시도해주세요.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
              examples:
                INTERNAL_ERROR:
                  summary: INTERNAL_ERROR
                  value:
                    code: INTERNAL_ERROR
                    message: 서버 오류가 발생했습니다. 잠시 후 다시 시도해주세요.
                    fields: {}
      description: '사번·이름·부서·직급/직책·회사 이메일·아이디·비밀번호·확인을 입력하고 JPG/PNG/WEBP 프로필 사진을 선택 등록한다. 사진 미등록 시 기본 프로필을 사용한다. 사번/아이디/이메일은
        중복 불가(409), 아이디 4자 이상, 비밀번호 8자 이상·UTF-8 72바이트 이하 및 확인 일치. 부서는 DB 목록에서 선택한다. USER로만 생성하며 성공 시 로그인 화면으로 이동한다.

        헤더의 사용자 정보를 선택하면 이름·부서·직급/직책·회사 이메일과 프로필 사진을 수정한다. JPG/PNG/WEBP를 허용하며 별도의 파일 용량 제한은 두지 않는다. 사진을 등록하지 않거나 제거하면 공통 기본
        프로필 이미지를 표시하고, 등록된 사진은 헤더·승인 대기·사용자 관리에 표시한다. 사번과 아이디는 읽기 전용이며 이메일 중복과 부서 유효성을 서버에서 검사한다.


        요구사항: REQ-FUNC-001, REQ-FUNC-020

        화면: SCR-SIGNUP-001, SCR-COMMON-002

        테이블: departments, users

        접근: 공개'
      x-requirements:
      - REQ-FUNC-001
      - REQ-FUNC-020
      x-screens:
      - SCR-SIGNUP-001
      - SCR-COMMON-002
      x-tables:
      - departments
      - users
      x-access: 공개
  /api/auth/signup:
    post:
      tags:
      - Auth
      summary: 직원 회원가입
      operationId: signup_api_auth_signup_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Signup'
            example:
              employee_no: EMP000001
              name: 윤명진
              department_id: 2
              job_title: Backend Developer
              email: myeongjin@example.com
              username: myeongjin
              password: ExampleOnly2026!
              password_confirm: ExampleOnly2026!
              profile_image: null
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserOut'
              example:
                id: 2
                employee_no: EMP000001
                name: 윤명진
                department_id: 2
                department:
                  id: 2
                  name: 개발팀
                job_title: Backend Developer
                email: myeongjin@example.com
                username: myeongjin
                role: USER
                profile_image: null
                created_at: '2026-09-08T09:00:00Z'
                updated_at: '2026-09-08T09:00:00Z'
        '409':
          description: 'DUPLICATE_USER: 가입 정보 또는 이메일이 중복됩니다. / CONFLICT: 동시에 변경된 데이터 또는 중복 정보가 있습니다. 새로고침 후 확인해주세요.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
              examples:
                DUPLICATE_USER:
                  summary: DUPLICATE_USER
                  value:
                    code: DUPLICATE_USER
                    message: 가입 정보 또는 이메일이 중복됩니다.
                    fields: {}
                CONFLICT:
                  summary: CONFLICT
                  value:
                    code: CONFLICT
                    message: 동시에 변경된 데이터 또는 중복 정보가 있습니다. 새로고침 후 확인해주세요.
                    fields: {}
        '422':
          description: 'INVALID_DEPARTMENT: 부서를 선택해주세요. / VALIDATION_ERROR: 입력값을 확인해주세요.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
              examples:
                INVALID_DEPARTMENT:
                  summary: INVALID_DEPARTMENT
                  value:
                    code: INVALID_DEPARTMENT
                    message: 부서를 선택해주세요.
                    fields:
                      _form: 필수값·형식·기간을 확인해주세요.
                VALIDATION_ERROR:
                  summary: VALIDATION_ERROR
                  value:
                    code: VALIDATION_ERROR
                    message: 입력값을 확인해주세요.
                    fields:
                      _form: 필수값·형식·기간을 확인해주세요.
        '500':
          description: 'INTERNAL_ERROR: 서버 오류가 발생했습니다. 잠시 후 다시 시도해주세요.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
              examples:
                INTERNAL_ERROR:
                  summary: INTERNAL_ERROR
                  value:
                    code: INTERNAL_ERROR
                    message: 서버 오류가 발생했습니다. 잠시 후 다시 시도해주세요.
                    fields: {}
      description: '사번·이름·부서·직급/직책·회사 이메일·아이디·비밀번호·확인을 입력하고 JPG/PNG/WEBP 프로필 사진을 선택 등록한다. 사진 미등록 시 기본 프로필을 사용한다. 사번/아이디/이메일은
        중복 불가(409), 아이디 4자 이상, 비밀번호 8자 이상·UTF-8 72바이트 이하 및 확인 일치. 부서는 DB 목록에서 선택한다. USER로만 생성하며 성공 시 로그인 화면으로 이동한다.


        요구사항: REQ-FUNC-001

