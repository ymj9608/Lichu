        '400':
          description: 'INVALID_TRANSITION: 이미 처리된 신청 또는 종료된 할당입니다.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
              examples:
                INVALID_TRANSITION:
                  summary: INVALID_TRANSITION
                  value:
                    code: INVALID_TRANSITION
                    message: 이미 처리된 신청 또는 종료된 할당입니다.
                    fields: {}
        '422':
          description: 'VALIDATION_ERROR: 입력값을 확인해주세요.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
              examples:
                VALIDATION_ERROR:
                  summary: VALIDATION_ERROR
                  value:
                    code: VALIDATION_ERROR
                    message: 입력값을 확인해주세요.
                    fields:
                      _form: 필수값·형식·기간을 확인해주세요.
        '409':
          description: 'CONFLICT: 동시에 변경된 데이터 또는 중복 정보가 있습니다. 새로고침 후 확인해주세요.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
              examples:
                CONFLICT:
                  summary: CONFLICT
                  value:
                    code: CONFLICT
                    message: 동시에 변경된 데이터 또는 중복 정보가 있습니다. 새로고침 후 확인해주세요.
                    fields: {}
        '500':
          description: 'INTERNAL_ERROR: 서버 오류가 발생했습니다. 잠시 후 다시 시도해주세요.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
              examples:
                INTERNAL_ERROR:
                  summary: INTERNAL_ERROR
                  value:
                    code: INTERNAL_ERROR
                    message: 서버 오류가 발생했습니다. 잠시 후 다시 시도해주세요.
                    fields: {}
      description: '라이선스 사용자 관리에서 수정 버튼을 선택하여 ACTIVE 할당의 권한 승인 시작일과 종료일을 변경한다. 시작일≤종료일을 클라이언트와 서버에서 검증하고 종료된 할당은 400으로 거부한다.
        완료 후 사용자 목록을 재조회하여 변경 기간을 표시한다.


        요구사항: REQ-FUNC-021

        화면: SCR-ADM-010

        테이블: license_assignments

        접근: MASTER'
